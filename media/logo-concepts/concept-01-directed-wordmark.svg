  <text x="114" y="786" fill="#97A3B6" font-family="Satoshi, General Sans, Inter, Segoe UI, sans-serif" font-size="15" letter-spacing="3">PREMIUM / DIRECTED / CLEAN / SOFTWARE-LED</text>
