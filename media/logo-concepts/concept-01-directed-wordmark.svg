  <g transform="translate(956 248)">
    <rect x="0" y="0" width="500" height="470" rx="36" fill="rgba(9,11,17,0.72)" stroke="rgba(255,255,255,0.08)"/>
    <text x="44" y="70" fill="#F5F7FB" font-family="Satoshi, General Sans, Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" letter-spacing="1.2">Why it fits</text>

    <text x="44" y="126" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">01</text>
    <text x="92" y="126" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">Keeps the brand word-led, which helps a new product own its name faster.</text>

    <text x="44" y="186" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">02</text>
    <text x="92" y="186" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">The path device suggests creative direction, progression, and a designed result.</text>

    <text x="44" y="246" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">03</text>
    <text x="92" y="246" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">Feels premium and software-native without leaning on robots, sparks, or browser clichés.</text>

    <text x="44" y="324" fill="#97A3B6" font-family="Satoshi, General Sans, Inter, Segoe UI, sans-serif" font-size="14" letter-spacing="3">PALETTE</text>
