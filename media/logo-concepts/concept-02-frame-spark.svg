<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient02" x1="196" y1="88" x2="1402" y2="834" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10141F"/>
      <stop offset="1" stop-color="#080A10"/>
    </linearGradient>
    <linearGradient id="accentGradient02" x1="216" y1="252" x2="618" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A5CFF"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <radialGradient id="glow02" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(404 392) rotate(36.8) scale(551 410)">
      <stop stop-color="#7A5CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7A5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" rx="40" fill="#06080C"/>
  <rect x="24" y="24" width="1552" height="852" rx="28" fill="url(#bgGradient02)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="84" y="84" width="1432" height="732" rx="28" fill="url(#glow02)"/>

  <text x="114" y="126" fill="#97A3B6" font-family="Satoshi, General Sans, Inter, Segoe UI, sans-serif" font-size="17" letter-spacing="4">SITEZY LOGO SYSTEM</text>
  <text x="114" y="168" fill="#F5F7FB" font-family="Satoshi, General Sans, Inter, Segoe UI, sans-serif" font-size="44" font-weight="700">Concept 02 / Frame + Spark</text>
  <text x="114" y="205" fill="#97A3B6" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="20">
    A cleaner app-icon route built from a website frame, a guided cut, and a single signal stroke.
  </text>

  <g transform="translate(144 248)">
    <rect x="0" y="0" width="760" height="470" rx="36" fill="rgba(11,13,18,0.46)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="82" y="78" width="236" height="236" rx="64" stroke="url(#accentGradient02)" stroke-width="22"/>
    <path d="M250 88L340 -2" stroke="#F5F7FB" stroke-width="14" stroke-linecap="round"/>
    <path d="M196 160L218 206L264 228L218 250L196 296L174 250L128 228L174 206L196 160Z" fill="#F5F7FB"/>
    <rect x="420" y="88" width="210" height="210" rx="50" fill="rgba(245,247,251,0.04)" stroke="rgba(245,247,251,0.1)"/>
    <rect x="452" y="120" width="146" height="146" rx="34" stroke="rgba(245,247,251,0.18)" stroke-width="2"/>
    <path d="M500 170H550" stroke="url(#accentGradient02)" stroke-width="12" stroke-linecap="round"/>
    <path d="M550 170L575 195" stroke="url(#accentGradient02)" stroke-width="12" stroke-linecap="round"/>
    <path d="M550 170L575 145" stroke="url(#accentGradient02)" stroke-width="12" stroke-linecap="round"/>
    <text x="82" y="404" fill="#F5F7FB" font-family="Satoshi, General Sans, Inter, Segoe UI, sans-serif" font-size="150" font-weight="700" letter-spacing="-10">Sitezy</text>
    <text x="84" y="448" fill="#97A3B6" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="20">Canvas logic with one sharp move. Clean enough for product chrome and app icons.</text>
  </g>

  <g transform="translate(956 248)">
    <rect x="0" y="0" width="500" height="470" rx="36" fill="rgba(9,11,17,0.74)" stroke="rgba(255,255,255,0.08)"/>
    <text x="44" y="70" fill="#F5F7FB" font-family="Satoshi, General Sans, Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" letter-spacing="1.2">Why it fits</text>

    <text x="44" y="126" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">01</text>
    <text x="92" y="126" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">Turns the website canvas into a brand asset without using a literal browser window.</text>

    <text x="44" y="186" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">02</text>
    <text x="92" y="186" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">The spark is structural rather than magical, which keeps the brand premium and restrained.</text>

    <text x="44" y="246" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">03</text>
    <text x="92" y="246" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">Most scalable route for favicon, app icon, and small UI signature usage.</text>

    <text x="44" y="324" fill="#97A3B6" font-family="Satoshi, General Sans, Inter, Segoe UI, sans-serif" font-size="14" letter-spacing="3">IDEAL USES</text>
    <text x="44" y="360" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">Product chrome</text>
    <text x="44" y="396" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">App icon / favicon</text>
    <text x="44" y="432" fill="#F5F7FB" font-family="General Sans, Satoshi, Inter, Segoe UI, sans-serif" font-size="18">Social avatar / profile mark</text>

    <rect x="280" y="338" width="160" height="160" rx="40" fill="#0B0D12" stroke="rgba(255,255,255,0.08)"/>
    <rect x="314" y="370" width="92" height="92" rx="26" stroke="url(#accentGradient02)" stroke-width="10"/>
    <path d="M388 376L426 338" stroke="#F5F7FB" stroke-width="10" stroke-linecap="round"/>
    <path d="M360 386L372 411L397 423L372 435L360 460L348 435L323 423L348 411L360 386Z" fill="#F5F7FB"/>
  </g>

  <text x="114" y="786" fill="#97A3B6" font-family="Satoshi, General Sans, Inter, Segoe UI, sans-serif" font-size="15" letter-spacing="3">ICON-FIRST / STRUCTURAL / CRISP / PRODUCT-READY</text>
</svg>
